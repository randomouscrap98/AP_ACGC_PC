# A simpler game for new players: build the statue (pay off every loan), no time locks, fewer kinds of checks.
# Favors, the museum and the Nook upgrades are still checks; tools come from the shop as usual.
name: Player
game: Animal Crossing
Animal Crossing:
  goal: ["Statue"]
  timesanity: false
  catalogsanity: false
  shellsanity: false
  tools_in_pool: false
  fossil_loans: false
  favor_pools: 3
  favors_per_pool: 5
  shops_always_open: false
